<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="newthreesection.css" />
    <link rel="stylesheet" href="nextthreesection.css" />
    <link rel="stylesheet" href="catalog.css" />
    <link rel="stylesheet" href="auth.css" />
    <script type="module" src="components.js"></script>
    <script type="module" src="admin.js"></script>
  </head>
  <body>
    <site-header></site-header>
    <main>
      <section class="container-for-catalog">
        <div class="admin-layout">
          <h1>Control Panel</h1>

          <!-- Создание и редактирование товаров -->
          <div class="admin-section">
            <h2 id="form-mode-title">Create New Product</h2>
            <form
              id="product-form"
              novalidate
              style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px"
            >
              <input type="hidden" id="prod-id" />
              <div class="input-group">
                <label for="prod-name">Name *</label>
                <input type="text" id="prod-name" required />
              </div>
              <div class="input-group">
                <label for="prod-cost">Cost ($) *</label>
                <input type="number" id="prod-cost" min="1" required />
              </div>
              <div class="input-group" style="grid-column: span 2">
                <label for="prod-desc">Description *</label>
                <textarea id="prod-desc" required></textarea>
              </div>
              <div class="input-group">
                <label for="prod-category">Category *</label>
                <select
                  id="prod-category"
                  style="
                    padding: 10px;
                    border-radius: 8px;
                    border: 1px solid #ccc;
                  "
                  required
                >
                  <option value="Acne">Acne</option>
                  <option value="Pigmentation">Pigmentation</option>
                  <option value="Hair loss">Hair loss</option>
                  <option value="Ageing">Ageing</option>
                  <option value="Everyday care">Everyday care</option>
                </select>
              </div>
              <div class="input-group">
                <label for="prod-photo">Photo URL *</label>
                <input type="text" id="prod-photo" required />
              </div>
              <div class="input-group" style="grid-column: span 2">
                <button
                  type="submit"
                  id="product-submit-btn"
                  class="submit-btn"
                  disabled
                >
                  Save Product
                </button>
              </div>
            </form>
          </div>

          <!-- Список текущих товаров -->
          <div class="admin-section">
            <h2>Current Catalog Products</h2>
            <div id="admin-products-container" class="prod-grid"></div>
          </div>

          <!-- Управление Отзывами -->
          <div class="admin-section">
            <h2>Reviews Management</h2>
            <div style="display: flex; gap: 20px; margin-bottom: 20px">
              <div class="input-group" style="flex: 1">
                <label for="filter-by-product">Filter by Product</label>
                <select
                  id="filter-by-product"
                  style="
                    padding: 10px;
                    border-radius: 8px;
                    border: 1px solid #ccc;
                  "
                >
                  <option value="">-- All Products --</option>
                </select>
              </div>
              <div class="input-group" style="flex: 1">
                <label for="filter-by-user">Filter by User</label>
                <select
                  id="filter-by-user"
                  style="
                    padding: 10px;
                    border-radius: 8px;
                    border: 1px solid #ccc;
                  "
                >
                  <option value="">-- All Clients --</option>
                </select>
              </div>
            </div>

            <div id="admin-reviews-container" class="feedback-list"></div>
          </div>
        </div>
      </section>
    </main>
    <site-footer></site-footer>
  </body>
</html>
